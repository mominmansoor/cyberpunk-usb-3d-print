<!doctype html>
<html lang="en">
<head>
<title>Cyberpunk USB 3D Print</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} body{margin:0;font:14px system-ui,sans-serif}
/* Layout: full-bleed 3D stage on the left, a slim spec-sheet rail on the right (stacks below on phones).
   Deliberately single dark look, like a render studio backdrop. */
:root {
  --stage: #2e2b2a;
  --rail: #1d1b1b;
  --line: #3b3736;
  --fg: #ece7e3;
  --muted: #a39a95;
  --accent: #e2372b;
  --trace: #7be07b;
  --display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--stage); color: var(--fg); font-family: var(--body); }
.app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 320px; }
.stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.hint {
  position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: 14px;
  font: 12px/1.4 var(--mono); color: var(--muted); pointer-events: none;
}
.views {
  position: absolute; top: 14px; left: max(16px, env(safe-area-inset-left, 0px));
  display: flex; gap: 6px; flex-wrap: wrap;
}
button, .views button {
  font: 500 12px/1 var(--mono); letter-spacing: .04em; text-transform: uppercase;
  color: var(--fg); background: rgba(29,27,27,.78); border: 1px solid var(--line);
  padding: 8px 11px; border-radius: 4px; cursor: pointer;
}
button:hover { border-color: var(--muted); }
button[aria-pressed="true"] { border-color: var(--accent); color: #fff; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--trace); outline-offset: 2px; }

.rail {
  background: var(--rail); border-left: 1px solid var(--line); overflow-y: auto;
  padding-block: 22px; padding-left: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 22px; min-width: 0;
}
h1 { font: 600 26px/1.05 var(--display); letter-spacing: .01em; margin: 0; text-wrap: balance; }
h1 span { color: var(--accent); }
.sub { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.seg button { padding: 11px 8px; }
.design { display: flex; flex-direction: column; gap: 8px; }
.viewing { display: flex; align-items: center; gap: 8px; font: 500 12px/1.3 var(--mono); color: var(--muted);
  border: 1px dashed var(--line); border-radius: 4px; padding: 8px 10px; }
.viewing b { color: var(--fg); font-weight: 500; }
.viewing .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
.viewing[data-design="public"] .dot { background: var(--trace); }
.specs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); }
.specs div { background: var(--rail); padding: 10px 8px; }
.specs b { display: block; font: 500 17px/1.1 var(--mono); font-variant-numeric: tabular-nums; }
.specs small { font: 11px/1.3 var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.label { font: 500 11px/1 var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin: 0 0 10px; display: flex; justify-content: space-between; }
.label output { color: var(--fg); font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.parts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.parts label {
  display: grid; grid-template-columns: 16px 14px 1fr auto; align-items: center; gap: 10px;
  padding: 9px 8px; border-radius: 4px; cursor: pointer;
}
.parts label:hover { background: #262322; }
.parts input { margin: 0; accent-color: var(--accent); }
.sw { width: 14px; height: 14px; border-radius: 2px; border: 1px solid rgba(255,255,255,.18); }
.pname { font-size: 14px; min-width: 0; }
.pname small { display: block; color: var(--muted); font-size: 12px; }
.row { display: flex; flex-direction: column; gap: 6px; padding: 4px 0 10px; border-bottom: 1px solid var(--line); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; padding-left: 26px; }
.chip { width: 20px; height: 20px; padding: 0; border-radius: 50%; border: 2px solid transparent; outline-offset: 1px; cursor: pointer;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); }
.chip[aria-pressed="true"] { border-color: var(--fg); }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.presets button { padding: 7px 9px; }
.vol { font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.note { font-size: 13px; line-height: 1.55; color: var(--muted); margin: 0; }
.note b { color: var(--fg); font-weight: 500; }

@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: 58vh auto; height: auto; }
  html, body { height: auto; }
  .stage { height: 58vh; }
  .rail { border-left: 0; border-top: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>

</head>
<body>
<div class="app">
  <div class="stage" id="stage">
    <div class="views" role="group" aria-label="Camera view">
      <button id="v-iso" aria-pressed="true">3/4</button>
      <button id="v-top">Top</button>
      <button id="v-side">Side</button>
      <button id="v-under">Underside</button>
      <button id="v-spin" aria-pressed="false">Spin</button>
    </div>
    <div class="hint">Drag to orbit · scroll or pinch to zoom · right-drag to pan</div>
  </div>

  <aside class="rail">
    <div>
      <h1>Cyberpunk <span>USB</span></h1>
      <p class="sub" id="sub">Long version · six single-colour parts</p>
    </div>

    <div class="seg" role="group" aria-label="Version">
      <button id="ver-v1" aria-pressed="true">v1 · Long</button>
      <button id="ver-v2" aria-pressed="false">v2 · Short</button>
    </div>

    <div class="specs">
      <div><b id="sp-len">92</b><small>mm long</small></div>
      <div><b id="sp-wid">27</b><small>mm wide</small></div>
      <div><b id="sp-thk">7.3</b><small>mm thick</small></div>
    </div>

    <div>
      <p class="label"><span>Explode · pull bridge</span><output id="ex-out">0 mm</output></p>
      <input id="explode" type="range" min="0" max="14" step="0.5" value="0" aria-label="Explode distance between layers">
    </div>

    <div>
      <p class="label"><span>Colour schemes</span></p>
      <div class="presets" id="presets"></div>
    </div>

    <div>
      <p class="label"><span>Parts · tap a colour</span><span>mm³</span></p>
      <ul class="parts" id="parts"></ul>
    </div>

    <p class="note" id="note"></p>
  </aside>
</div>

function b64(str, Type) {
  const bin = atob(str); const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  return new Type(buf.buffer);
}

let objs = {}, current = null;
const cache = {};
function meshFor(ver, key) {
  const id = design + "/" + ver + "/" + key;
  if (cache[id]) return cache[id];
  const d = MESHES[ver].parts[key];
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(b64(d.v, Float32Array), 3));
  g.setIndex(new THREE.BufferAttribute(b64(d.i, Uint32Array), 1));
  const flat = g.toNonIndexed();
  flat.computeVertexNormals();
  const L = LOOK[d.fil];
  const mat = new THREE.MeshStandardMaterial({
    color: L.color, metalness: L.metal, roughness: L.rough, flatShading: true,
    emissive: L.glow || 0x000000, emissiveIntensity: L.glow ? 1 : 0,
  });
  const mesh = new THREE.Mesh(flat, mat);
  mesh.castShadow = mesh.receiveShadow = true;
  return (cache[id] = mesh);
}

const list = document.getElementById("parts");
function showVersion(ver) {
  current = ver;
  const V = VERSIONS[ver];
  model.clear();
  objs = {};
  list.innerHTML = "";
  const groups = new Map();
  for (const [key, name] of V.parts) {
    const mesh = meshFor(ver, key);
    mesh.visible = true;
    mesh.userData.level = MESHES[ver].parts[key].level;
    mesh.userData.slide = MESHES[ver].parts[key].slide;
    mesh.userData.along = MESHES[ver].parts[key].along || 0;
    model.add(mesh);
    objs[key] = mesh;
    const g = groupOf(key);
    if (!groups.has(g)) groups.set(g, { keys: [], name: name.replace(/, (top|bottom)$/, ""), fil: MESHES[ver].parts[key].fil });
    groups.get(g).keys.push(key);
  }
  for (const [g, info] of groups) {
    const ref = info.fil === "Reference" || info.fil === "Card";
    const vol = info.keys.reduce((t, k) => t + MESHES[ver].parts[k].vol, 0);
    const li = document.createElement("li");
    li.className = "row";
    const id = `t-${ver}-${g}`;
    li.innerHTML = `<label for="${id}">
        <input type="checkbox" id="${id}" checked>
        <span class="sw"></span>
        <span class="pname">${info.name}${info.keys.length > 1 ? " ×2" : ""}<small></small></span>
        <span class="vol">${ref ? "—" : Math.round(vol).toLocaleString()}</span>
      </label>`;
    li.querySelector("input").addEventListener("change", e => { for (const k of info.keys) objs[k].visible = e.target.checked; });
    const sw = li.querySelector(".sw"), sub = li.querySelector("small");
    const apply = (pname) => {
      const p = PAL[pname];
      for (const k of info.keys) {
        const mat = objs[k].material;
        mat.color.setHex(p[1]); mat.metalness = p[2]; mat.roughness = p[3];
        mat.emissive.setHex(g === "green" ? p[1] : 0x000000); mat.emissiveIntensity = g === "green" ? .22 : 0;
      }
      sw.style.background = "#" + p[1].toString(16).padStart(6, "0");
      sub.textContent = pname + (g === "green" ? " · paper or thin print" : "");
      for (const c of li.querySelectorAll(".chip")) c.setAttribute("aria-pressed", String(c.dataset.name === pname));
    };
    if (ref) {
      sw.style.background = "#" + LOOK[info.fil].color.toString(16).padStart(6, "0");
      sub.textContent = "Shown for reference";
    } else {
      const chips = document.createElement("div");
      chips.className = "chips";
      for (const [pname, hex] of PALETTE) {
        const c = document.createElement("button");
        c.className = "chip"; c.dataset.name = pname; c.title = pname;
        c.setAttribute("aria-label", `${info.name}: ${pname}`);
        c.style.background = "#" + hex.toString(16).padStart(6, "0");
        c.addEventListener("click", () => { chosen[ver][g] = pname; saveChoice(); apply(pname); });
        chips.appendChild(c);
      }
      li.appendChild(chips);
      li._apply = apply; li._group = g; li._default = info.fil;
      apply(chosen[ver][g] || info.fil);
    }
    list.appendChild(li);
  }
  document.getElementById("sub").textContent = V.sub;
  document.getElementById("note").innerHTML = V.note;
  document.getElementById("note").innerHTML = V.note + " " + DESIGNS[design].note;
  document.getElementById("sp-len").textContent = Math.round(MESHES[ver].len);
  document.getElementById("sp-wid").textContent = MESHES[ver].wid;
  document.getElementById("sp-thk").textContent = MESHES[ver].thk;
  for (const v of ["v1", "v2"]) document.getElementById("ver-" + v).setAttribute("aria-pressed", String(v === ver));
}

  showVersion(current || "v1");
}
document.getElementById("ver-v1").addEventListener("click", () => showVersion("v1"));
document.getElementById("ver-v2").addEventListener("click", () => showVersion("v2"));

showDesign("public");

const presetBox = document.getElementById("presets");
for (const name of Object.keys(SCHEMES)) {
  const b = document.createElement("button");
  b.textContent = name;
  b.addEventListener("click", () => {
    for (const ver of ["v1", "v2"]) {
      chosen[ver] = {};
      if (SCHEMES[name]) for (const [g, role] of Object.entries(ROLE[ver])) chosen[ver][g] = SCHEMES[name][role];
    }
    saveChoice();
    for (const li of list.children) if (li._apply) li._apply(chosen[current][li._group] || li._default);
  });
  presetBox.appendChild(b);
}

// ---- explode
const slider = document.getElementById("explode");
const exOut = document.getElementById("ex-out");
let exTarget = 0, exNow = 0;
slider.addEventListener("input", () => { exTarget = +slider.value; exOut.textContent = `${slider.value} mm`; });

// ---- views
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const VIEWS = {
  iso:   [ 95, 80, 85],
  top:   [  0, 170, 0.01],
  side:  [150, 18, 0],
  under: [ 70, -95, 70],
};
let camGoal = null;
function setView(name) {
  for (const b of document.querySelectorAll(".views button:not(#v-spin)")) b.setAttribute("aria-pressed", String(b.id === "v-" + name));
  const [x, y, z] = VIEWS[name];
  const goal = new THREE.Vector3(x, y, z);
  if (reduce) { camera.position.copy(goal); controls.target.set(0, 0, 0); }
  else camGoal = goal;
  ground.visible = name !== "under";
}
for (const n of Object.keys(VIEWS)) document.getElementById("v-" + n).addEventListener("click", () => setView(n));
const spinBtn = document.getElementById("v-spin");
spinBtn.addEventListener("click", () => {
  controls.autoRotate = !controls.autoRotate;
  spinBtn.setAttribute("aria-pressed", String(controls.autoRotate));
});
controls.autoRotateSpeed = 1.6;
controls.addEventListener("start", () => { camGoal = null; });

camera.position.set(...VIEWS.iso);
controls.target.set(0, 0, 0);

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  // pull back on narrow screens so the whole stick fits
  camera.zoom = Math.min(1, camera.aspect / 1.1 + .25);
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();

function tick() {
  exNow += (exTarget - exNow) * (reduce ? 1 : .15);
  for (const k in objs) { const u = objs[k].userData; objs[k].position.z = u.level * exNow; objs[k].position.x = u.slide * exNow * 1.8; objs[k].position.y = (u.along || 0) * exNow * 0.9; }
  ground.position.y = -2.75 - 3 * exNow;
  if (camGoal) {
    camera.position.lerp(camGoal, .12);
    controls.target.lerp(new THREE.Vector3(0, 0, 0), .12);
    if (camera.position.distanceTo(camGoal) < .3) camGoal = null;
  }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
